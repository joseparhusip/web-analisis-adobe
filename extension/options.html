<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Stock Research Companion</title>
    <style>
      body { font: 14px system-ui, sans-serif; padding: 24px; max-width: 420px; color: #18181b; }
      label { display: block; font-weight: 600; margin-top: 14px; margin-bottom: 6px; }
      input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #d4d4d8; border-radius: 8px; }
      button { margin-top: 16px; padding: 8px 14px; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; }
      p { color: #6b6b73; font-size: 12px; }
    </style>
  </head>
  <body>
    <label for="appUrl">Alamat aplikasi Stock Research</label>
    <input id="appUrl" type="url" placeholder="http://localhost:3000" />
    <p>Untuk ngrok, isi URL ngrok-nya (https://...ngrok-free.app).</p>

    <label for="workspace">Workspace ID</label>
    <input id="workspace" type="text" placeholder="default" />
    <p>Samakan dengan workspace yang kamu pakai di aplikasi. Biarkan "default" kalau tanpa login.</p>

    <button id="save" type="button">Simpan</button>
    <p id="status"></p>
    <script src="options.js"></script>
  </body>
</html>
